[project]
name = "fundata"
version = "1.0.4"
description = "用于索引、下载和管理常见机器学习公开数据集的工具库"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "funshell>=1.0.22",
    "farlog>=1.1.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# fundata.dataset 下的具体数据集处理类（ElectronicsData/CriteoData 等）依赖的重型 ML 库，
# 主依赖不默认安装，按需通过 `pip install fundata[dataset]` 引入。
#
dataset = [
    "tensorflow>=2.15; python_version >= '3.11'",
    "keras>=3.15; python_version >= '3.11'",
    "scikit-learn>=1.3; python_version >= '3.11'",
    "funkeras>=0.8; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
